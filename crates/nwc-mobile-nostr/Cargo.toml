[package]
name = "nwc-mobile-nostr"
description = "Bounded Nostr relay integration for nwc-mobile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
futures-util = { version = "0.3", features = ["sink"] }
nwc-mobile = { version = "=0.1.0", path = "../nwc-mobile" }
serde_json = "1"
tokio = { version = "=1.43.1", features = ["macros", "time"] }
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

[lints]
workspace = true
