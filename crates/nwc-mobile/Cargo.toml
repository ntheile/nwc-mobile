[package]
name = "nwc-mobile"
description = "Secure Nostr Wallet Connect infrastructure for mobile wallets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
readme = "../../README.md"
keywords = ["bitcoin", "lightning", "nostr", "nwc", "mobile"]
categories = ["cryptography::cryptocurrencies"]
publish = false

[features]
default = []
# Emits bounded, non-secret method and dispatch diagnostics for host applications.
diagnostics = []

[dependencies]
# Pin optional transitive packages whose latest manifests exceed the workspace
# MSRV; Cargo includes them when resolving the complete feature graph.
base64ct = "=1.7.3"
base64 = "=0.22.1"
getrandom = "0.3.4"
# Keep the reviewed URL parsing graph pinned across wallet integrations.
idna_adapter = "=1.1.0"
nostr = { version = "=0.44.7", features = ["nip04", "nip44", "nip47", "nip98"] }
# Keep one reviewed SQLite version so host applications can link their own
# persistence graph without two crates claiming `links = sqlite3`.
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
url = "2.5.8"
zeroize = "=1.8.2"

[lints]
workspace = true
