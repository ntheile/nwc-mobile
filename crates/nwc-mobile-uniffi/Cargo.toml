[package]
name = "nwc-mobile-uniffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
nwc-mobile-http = { version = "=0.1.0", path = "../nwc-mobile-http" }
nwc-mobile-bolt11 = { version = "=0.1.0", path = "../nwc-mobile-bolt11" }
nwc-mobile-nostr = { version = "=0.1.0", path = "../nwc-mobile-nostr" }
async-trait = "=0.1.92"
nwc-mobile = { version = "=0.1.0", path = "../nwc-mobile" }
nwc-mobile-tokio = { version = "=0.1.0", path = "../nwc-mobile-tokio" }
uniffi = { version = "=0.31.1", default-features = false }
zeroize = "=1.8.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
