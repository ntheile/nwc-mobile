[package]
name = "nwc-mobile-http"
description = "Secure HTTPS wake-registration transport for nwc-mobile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
nwc-mobile = { version = "=0.1.0", path = "../nwc-mobile" }
nwc-mobile-tokio = { version = "=0.1.0", path = "../nwc-mobile-tokio" }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
