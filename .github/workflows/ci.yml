name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android WorkManager package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 9.5.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: 9.5.0

      - name: Test and lint Android package
        run: gradle --project-dir android/nwc-mobile --no-daemon build lint

  apple:
    name: Apple NSE package
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Swift formatting
        run: >-
          swift format lint --strict --recursive
          apple/NwcMobileApple/Sources
          apple/NwcMobileApple/Tests
          Package.swift
          apple/NwcMobileApple/Package.swift

      - name: Test distributable Swift package
        run: swift test

  quality:
    name: Format, lint, test, and document
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - name: Check formatting
        run: cargo +stable fmt --all --check

      - name: Lint
        run: cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo +stable test --locked --workspace --all-features

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --locked --workspace --all-features --no-deps

      - name: Check shared native contract fixture
        run: ./scripts/check-native-contract.sh

      - name: Check generated Swift and Kotlin contract
        run: ./scripts/check-generated-bindings.sh

  msrv:
    name: Minimum supported Rust 1.84
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install minimum supported Rust
        run: rustup toolchain install 1.84.0 --profile minimal

      - name: Test with minimum supported Rust
        run: cargo +1.84.0 test --locked --workspace --all-features

  supply-chain:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install verified cargo-deny
        shell: bash
        env:
          CARGO_DENY_VERSION: 0.20.2
          CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/cargo-deny.tar.gz"
          install_dir="${RUNNER_TEMP}/cargo-deny"
          release="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"

          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${archive}" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${release}.tar.gz"
          printf '%s  %s\n' "${CARGO_DENY_SHA256}" "${archive}" | sha256sum --check
          mkdir --parents "${install_dir}"
          tar --extract --gzip --file "${archive}" --directory "${install_dir}" \
            --strip-components=1
          printf '%s\n' "${install_dir}" >> "${GITHUB_PATH}"

      - name: Enforce dependency policy
        run: cargo deny --locked --all-features check advisories bans licenses sources

      - name: Check compile-time dependency allowlist
        run: |
          ./scripts/test-build-unit-classifier.sh
          ./scripts/check-build-units.sh
