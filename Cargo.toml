[workspace]
members = [
    "crates/nwc-mobile",
    "crates/nwc-mobile-uniffi",
    "tools/uniffi-bindgen",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
repository = "https://github.com/ntheile/nwc-mobile"
license = "MIT"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
